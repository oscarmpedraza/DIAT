<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Front End Store | Camisetas para desarrolladores</title>
    <meta name="description" content="Camisetas con los logos de las tecnologías que usas todos los días: React, Vue, Node.js, TypeScript y más.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-pagina="tienda">
    <a class="saltar" href="#contenido">Saltar al contenido</a>

    <div class="franja">Envío gratis en todos los pedidos</div>

    <header class="cabecera">
        <div class="cabecera__interior">
            <a class="cabecera__marca" href="index.html">
                <img class="cabecera__logo" src="img/logo.png" alt="Front End Store, ir al inicio">
            </a>

            <form class="buscador" action="index.html" role="search">
                <label class="visualmente-oculto" for="q">Buscar productos</label>
                <input id="q" name="q" type="search" placeholder="Buscar por tecnología" autocomplete="off">
                <button type="submit" aria-label="Buscar">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
                </button>
            </form>

            <a class="boton-carrito" href="carrito.html" data-abrir-carrito aria-label="Carrito, 0 productos">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3h3l2.6 12.2a1 1 0 0 0 1 .8h9.7a1 1 0 0 0 1-.8L21 7H6"/><circle cx="9.5" cy="20" r="1.4"/><circle cx="17.5" cy="20" r="1.4"/></svg>
                <span>Carrito</span>
                <span class="boton-carrito__cuenta" data-cuenta data-vacio="true" aria-hidden="true">0</span>
            </a>
        </div>
    </header>

    <nav class="navegacion" aria-label="Principal">
        <div class="navegacion__interior">
            <a class="navegacion__enlace navegacion__enlace--activo" href="index.html" aria-current="page">Tienda</a>
            <a class="navegacion__enlace" href="nosotros.html">Nosotros</a>
        </div>
    </nav>

    <main class="contenedor" id="contenido">
        <h1>Nuestros productos</h1>

        <div class="tienda">
            <aside class="filtros" aria-label="Filtrar por categoría">
                <h2>Categorías</h2>
                <ul id="lista-categorias"></ul>
            </aside>

            <section aria-label="Catálogo">
                <div class="barra">
                    <p id="conteo" role="status" aria-live="polite"></p>
                    <div>
                        <label for="orden">Ordenar por</label>
                        <select id="orden">
                            <option value="destacados">Destacados</option>
                            <option value="az">Nombre, de A a Z</option>
                            <option value="za">Nombre, de Z a A</option>
                        </select>
                    </div>
                </div>

                <div class="grid" id="cuadricula"></div>
            </section>
        </div>
    </main>

    <footer class="footer">
        <div class="footer__interior">
            <p class="footer__texto">Front End Store - Todos los derechos reservados 2026.</p>
            <nav class="footer__enlaces" aria-label="Pie de página">
                <a href="index.html">Tienda</a>
                <a href="nosotros.html">Nosotros</a>
                <a href="carrito.html">Carrito</a>
            </nav>
        </div>
    </footer>

    <script src="js/productos.js"></script>
    <script src="js/carrito.js"></script>
    <script src="js/tienda.js"></script>
</body>
</html>
